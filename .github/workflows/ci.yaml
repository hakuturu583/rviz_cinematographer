name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # The release workflow re-runs the build on the commit it is about to tag.
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: true
  schedule:
    # Weekly build to catch upstream API changes (especially on rolling)
    - cron: "0 0 * * 0"

concurrency:
  # Keyed on the ref being built, so a release run (unique tag) never cancels or is
  # cancelled by the regular CI of its branch.
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ !inputs.ref }}

jobs:
  build:
    name: ${{ matrix.ros_distro }}
    runs-on: ubuntu-latest
    container:
      image: ros:${{ matrix.ros_distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy, kilted, lyrical, rolling]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: src/rviz2_cinematographer
          ref: ${{ inputs.ref }}

      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro "${ROS_DISTRO}"
          rosdep install --from-paths src --ignore-src --rosdistro "${ROS_DISTRO}" -y -r

      - name: Build
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          colcon build \
            --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Test
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose
